<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #fff;
      color: #000;
      font-size: 14px;
      line-height: 1.6;
    }
    h1 {
      font-size: 16px;
      font-weight: bold;
      border-bottom: 1px solid #000;
      padding-bottom: 8px;
      margin: 0 0 16px;
    }
    p { margin: 0 0 6px; }
    address {
      margin-top: 24px;
      font-style: normal;
      font-size: 12px;
      color: #555;
      border-top: 1px solid #ccc;
      padding-top: 8px;
    }
    .hint {
      margin-top: 32px;
      color: #999;
      font-size: 12px;
      display: inline-block;
      animation: float 2.4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <h1>403 禁止访问</h1>
  <p>您没有权限访问此资源。</p>
  <address>NBTI 服务器 nbti.local 端口 443</address>
  <p class="hint">触碰屏幕继续</p>
  <script>
    function go() {
      sessionStorage.setItem('nbti_splash_seen', 'true');
      window.location.href = 'result.html';
    }
    document.addEventListener('click', go);
    document.addEventListener('touchstart', go);
  </script>
</body>
</html>
